<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ partial "site-header.html" . }}
    <main id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "site-footer.html" . }}
  </body>
</html>
