introduction: >-
  I am broadly interested in complexity theory, including quantum complexity,
  Sum-of-Squares optimization, and query and communication complexity.
biography:
  - >-
    I obtained my Ph.D. in Computer Science from the University of California,
    Los Angeles, where I was fortunate to be advised by
    [Alexander Sherstov](http://web.cs.ucla.edu/~sherstov/).
  - >-
    I spent two years as a postdoctoral member at the Institute for Advanced
    Study under the supervision of
    [Avi Wigderson](https://www.math.ias.edu/avi/home), followed by one year as a
    postdoctoral researcher at the Weizmann Institute, hosted by
    [Thomas Vidick](https://www.weizmann.ac.il/math/vidick/home).
